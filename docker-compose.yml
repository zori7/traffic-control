services:
  db:
    image: postgres:16-alpine
    container_name: traffic-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic_control
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic_control"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
