server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, annotated media and Socket.IO are proxied to the api service, so
    # the browser sees a single origin and the HttpOnly auth cookies just work.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api:8000;
    }

    location /media/ {
        proxy_pass http://api:8000;
        # Stream HLS segments straight through instead of buffering whole files.
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://api:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Single-page app: unknown paths fall back to the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
