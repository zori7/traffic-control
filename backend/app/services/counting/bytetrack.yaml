# Tuned ByteTrack for small, low-contrast vehicles on low-resolution feeds.
# Thresholds track the detector's low confidence (YOLO_CONF), so dim cars on
# dark asphalt can still start and keep tracks. track_buffer is raised to ride
# through the intermittent detections typical of low-light footage.
tracker_type: bytetrack
track_high_thresh: 0.1
track_low_thresh: 0.05
new_track_thresh: 0.1
track_buffer: 45
match_thresh: 0.8
fuse_score: True